[project]
name = "football-data-ai-platform"
version = "0.1.0"
description = "Durable football data ingestion with Temporal, and an AI scouting agent on top."
readme = "README.md"
license = "MIT"
authors = [{ name = "Felipe Allegretti" }]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "camoufox[geoip]==0.5.8",
    "curl-cffi==0.16.3",
    "dbt-postgres==1.11.0",
    "duckdb==1.4.1",
    "httpx>=0.28.1,<1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "rapidfuzz==3.14.6",
    "sqlalchemy==2.1.4",
    "temporalio==1.34.0",
    "transfermarkt-api==5.0.0",
]

[project.scripts]
fdap = "football_data_ai_platform.ingestion.cli:main"

[dependency-groups]
dev = [
    "import-linter",
    "langfuse==4.17.0",
    "pyright",
    "pytest",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--numprocesses=auto", "--dist=worksteal"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "football_data_ai_platform"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Provider SDKs only inside agent.providers.<provider> (ADR 24)"
type = "forbidden"
source_modules = ["football_data_ai_platform"]
forbidden_modules = [
    "anthropic",
    "cohere",
    "litellm",
    "mistralai",
    "ollama",
    "openai",
]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "football_data_ai_platform.agent.providers.anthropic -> anthropic",
    "football_data_ai_platform.agent.providers.anthropic.** -> anthropic",
]

[[tool.importlinter.contracts]]
name = "Raw Response recording is source-neutral"
type = "forbidden"
source_modules = ["football_data_ai_platform.sources.recording"]
forbidden_modules = [
    "football_data_ai_platform.sources.sofascore",
    "football_data_ai_platform.sources.transfermarkt",
    "transfermarkt_api",
]

[[tool.importlinter.contracts]]
name = "curl_cffi only behind the impersonating transport (ADR 14)"
type = "forbidden"
source_modules = ["football_data_ai_platform"]
forbidden_modules = ["curl_cffi"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = ["football_data_ai_platform.sources.impersonation -> curl_cffi"]

[[tool.importlinter.contracts]]
name = "camoufox only in Sofascore's Token Provider (ADR 30)"
type = "forbidden"
source_modules = ["football_data_ai_platform"]
forbidden_modules = ["camoufox", "playwright"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "football_data_ai_platform.sources.sofascore.captcha -> camoufox",
    "football_data_ai_platform.sources.sofascore.captcha -> playwright",
]
