version: 2

models:
  - name: base_sofascore__responses
    description: The latest successful Raw Response per Sofascore URL.
    columns:
      - name: url
        data_tests: [unique, not_null]

  - name: stg_sofascore__matches
    description: Finished Sofascore Matches, one row per event.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: season_year
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]

  - name: stg_sofascore__appearances
    description: One Appearance per player with minutes in a finished Sofascore Match.
    columns:
      - name: appearance_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sofascore__matches')
                field: match_id
      - name: player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: minutes_played
        data_tests: [not_null]

  - name: stg_sofascore__players
    description: Every player in a stored Sofascore lineup, with birth date and nationality.
    columns:
      - name: player_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: nationality
        description: Sofascore's name for the player's country, as it spells it.
      - name: nationality_alpha3
        description: >
          Sofascore's code for that country, mapped to a Nationality code in the
          `country_mappings` seed. ISO alpha-3, except for the home nations (`ENG`, `SCO`).

  - name: stg_sofascore__actions
    description: >
      Located Actions from each player's rating breakdown in a finished Match. A 404 for a
      rating breakdown is no Actions. Coordinates run 0-100: x from the player's own goal
      line, y from the right touchline to the left one.
    columns:
      - name: action_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sofascore__matches')
                field: match_id
      - name: player_id
        data_tests: [not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [passes, dribbles, ball-carries, defensive]

  - name: stg_sofascore__shots
    description: >
      Shots from each finished Match's shotmap, with xG and xGOT, located as Sofascore gives
      them: x from the goal attacked, y from the left touchline.
    columns:
      - name: shot_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sofascore__matches')
                field: match_id
      - name: player_id
        data_tests: [not_null]
