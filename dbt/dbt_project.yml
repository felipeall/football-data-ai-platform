name: football_data_ai_platform
version: "1.0.0"
profile: football_data_ai_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  football_data_ai_platform:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

# Built with the marts (step 4 of the Transform Run), never by step 1's `--select staging`:
# only marts may ref a seed.
seeds:
  football_data_ai_platform:
    +schema: staging

vars:
  # The Seasons the Player marts hold (ADR 35: the PoC covers 25/26). Stored Matches of other
  # Seasons stay in staging and `marts.matches`. The Transform Run passes `COVERED_SEASON`;
  # this default serves dbt run by hand.
  covered_seasons: [2025]

flags:
  send_anonymous_usage_stats: false
