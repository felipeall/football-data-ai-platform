name: football_data_ai_platform
version: "1.0.0"
profile: football_data_ai_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  football_data_ai_platform:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

vars:
  # The Seasons the Player marts hold (ADR 35: the PoC covers 25/26). Stored Matches of other
  # Seasons stay in staging and `marts.matches`. Override with `--vars`.
  covered_seasons: [2025]

flags:
  send_anonymous_usage_stats: false
